<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Alunos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Cadastro de Alunos</h1>
    <p class="sub">Cada aluno pertence a um curso </p>
  </header>

  <main class="container">
    <div id="status" class="status" role="status"></div>

    <section class="card">
      <h2>Cursos <span class="badge">lado 1</span></h2>
      <form id="form-curso" class="form-linha">
        <input id="curso-nome" type="text" placeholder="Nome do curso" required>
        <button type="submit" class="btn">Adicionar curso</button>
      </form>
      <ul id="lista-cursos" class="lista"></ul>
    </section>

    <section class="card">
      <h2>Alunos <span class="badge">lado N</span></h2>
      <form id="form-aluno" class="form-grid">
        <label>Nome *
          <input id="aluno-nome" type="text" required>
        </label>
        <label>RA *
          <input id="aluno-ra" type="text" required>
        </label>
        <label>Curso *
          <select id="aluno-curso" required></select>
        </label>
        <div class="acoes">
          <button type="submit" id="btn-salvar-aluno" class="btn">Salvar aluno</button>
          <button type="button" id="btn-cancelar" class="btn ghost" hidden>Cancelar edição</button>
        </div>
      </form>

      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>RA</th>
              <th>Curso</th>
              <th class="col-acoes"></th>
            </tr>
          </thead>
          <tbody id="tabela-alunos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
